# Publica la app (carpeta app/) en GitHub Pages cada vez que cambia.
name: Publicar la app
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/publicar.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: despliegue
        uses: actions/deploy-pages@v5
